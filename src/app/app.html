<app-header
  [favoritesCount]="favorites.count()"
  (examplesClick)="showExamples()"
  (favoritesClick)="openFavorites(false)"
/>

<main class="workspace">
  <app-regex-editor (saveFavorite)="openFavorites(true)" />

  <div class="main-grid">
    <div class="input-column">
      <app-test-text-editor />
      <app-highlighted-text />
    </div>
    <div class="results-column">
      <app-match-list />
    </div>
  </div>

  <section class="card tools" #toolsPanel aria-label="Ferramentas">
    <div class="tabs" role="tablist" aria-label="Ferramentas">
      <button
        type="button"
        role="tab"
        id="tab-explainer"
        aria-controls="tool-panel"
        [attr.aria-selected]="activeTab() === 'explainer'"
        [class.active]="activeTab() === 'explainer'"
        (click)="activeTab.set('explainer')"
      >
        <svg lucideLightbulb [size]="15"></svg>
        Entenda sua Regex
      </button>
      <button
        type="button"
        role="tab"
        id="tab-code"
        aria-controls="tool-panel"
        [attr.aria-selected]="activeTab() === 'code'"
        [class.active]="activeTab() === 'code'"
        (click)="activeTab.set('code')"
      >
        <svg lucideBraces [size]="15"></svg>
        Gerador de código
      </button>
      <button
        type="button"
        role="tab"
        id="tab-examples"
        aria-controls="tool-panel"
        [attr.aria-selected]="activeTab() === 'examples'"
        [class.active]="activeTab() === 'examples'"
        (click)="activeTab.set('examples')"
      >
        <svg lucideLibrary [size]="15"></svg>
        Exemplos de Regex
      </button>
    </div>

    <div class="tab-panel" id="tool-panel" role="tabpanel" [attr.aria-labelledby]="'tab-' + activeTab()">
      @switch (activeTab()) {
        @case ('explainer') {
          <app-regex-explainer />
        }
        @case ('code') {
          <app-code-generator />
        }
        @case ('examples') {
          <app-regex-examples (loaded)="onExampleLoaded()" />
        }
      }
    </div>
  </section>
</main>

<footer class="footer">
  <span>RegexLab</span>
  <span aria-hidden="true">·</span>
  <span>Processamento 100% local, em Web Workers, sem envio de dados.</span>
</footer>

@if (favoritesOpen()) {
  <app-favorites-drawer [startWithNew]="favoritesStartNew()" (closed)="favoritesOpen.set(false)" />
}
